name: Briefing Ekonomi Harian

on:
  schedule:
    # 06:00 WIB = 23:00 UTC hari sebelumnya (WIB = UTC+7)
    - cron: "0 23 * * *"
  workflow_dispatch:      # tombol "Run workflow" manual, dan endpoint /api/tarik
    inputs:
      kategori:
        description: "Kunci kategori dipisah koma, kosong = semua"
        required: false
        default: ""
      telegram:
        description: "Kirim ke Telegram (true/false)"
        required: false
        default: "true"

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  kirim-briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pasang dependensi
        run: pip install -r requirements.txt

      - name: Jalankan agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          KATEGORI: ${{ inputs.kategori }}
          KIRIM_TELEGRAM: ${{ inputs.telegram }}
        run: python agent.py
